git:
  overrideGpg: true
  autoForwardBranches: none
keybinding:
  universal:
    scrollUpMain-alt1: <c-k>
    scrollDownMain-alt1: <c-j>
  commits:
    moveUpCommit: K
    moveDownCommit: J
gui:
  useHunkModeInDiffView: false
  border: 'single'
  nerdFontsVersion: '3'
  filterMode: fuzzy
  theme:
    showDivergenceFromBaseBranch: arrowAndNumber
    selectedLineBgColor:
      - reverse
    branchColorPatterns:
      '^master(/|$)': red
  showNumstatInFilesView: true
